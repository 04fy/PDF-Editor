<!DOCTYPE html>

<meta name="description" content="Professional PDF editing in the browser: text, images, shapes, form fields and page layout, in every writing system. Nothing is uploaded.">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="css/app.css">
</head>

<div id="app">

  <!-- ─────────────────────────── top bar ─────────────────────────── -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-pages"/></svg>
      </span>
      <span class="brand-text">
        <strong class="brand-name" data-i18n="appName">HTML PDF Modifier</strong>
        <span class="brand-doc" id="doc-name"></span>
      </span>
    </div>

    <div class="bar-group">
      <button class="btn" data-action="open"><svg class="icon" viewBox="0 0 24 24"><use href="#i-open"/></svg><span data-i18n="open">Open PDF</span></button>
      <button class="btn" data-action="open-url" title="openUrl"><svg class="icon" viewBox="0 0 24 24"><use href="#i-link"/></svg></button>
      <button class="btn" data-action="open-project" title="load"><svg class="icon" viewBox="0 0 24 24"><use href="#i-folder"/></svg></button>
      <button class="btn" data-action="save-project" title="save"><svg class="icon" viewBox="0 0 24 24"><use href="#i-save"/></svg></button>
      <button class="btn primary" data-action="download"><svg class="icon" viewBox="0 0 24 24"><use href="#i-export"/></svg><span data-i18n="download">Save PDF</span></button>
    </div>

    <div class="bar-group" id="tools">
      <button class="btn tool active" data-tool="select" data-i18n-title="tool.select" title="Select (V)">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-cursor"/></svg><span data-i18n="tool.select">Select</span></button>
      <button class="btn tool" data-tool="text" data-i18n-title="tool.text" title="Text (T)">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-text"/></svg><span data-i18n="tool.text">Text</span></button>
      <button class="btn tool" data-tool="rect" data-i18n-title="tool.rect" title="Rectangle (R)">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-rect"/></svg></button>
      <button class="btn tool" data-tool="ellipse" data-i18n-title="tool.ellipse" title="Ellipse (O)">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-ellipse"/></svg></button>
      <button class="btn tool" data-tool="line" data-i18n-title="tool.line" title="Line (L)">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-line"/></svg></button>
      <button class="btn tool" data-tool="image" data-i18n-title="tool.image" title="Image (I)">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-image"/></svg></button>
      <button class="btn tool" data-tool="redact" data-i18n-title="tool.redact" title="Redact (B)">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-redact"/></svg></button>
      <span class="bar-sep"></span>
      <button class="btn tool" data-tool="form-text" data-i18n-title="tool.formText" title="Text field (F)">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-form-text"/></svg></button>
      <button class="btn tool" data-tool="checkbox" data-i18n-title="tool.checkbox" title="Checkbox (C)">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-checkbox"/></svg></button>
      <button class="btn tool" data-tool="radio" data-i18n-title="tool.radio" title="Radio (R2)">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-radio"/></svg></button>
      <button class="btn tool" data-tool="dropdown" data-i18n-title="tool.dropdown" title="Dropdown (D)">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-dropdown"/></svg></button>
    </div>

    <div class="bar-group">
      <button class="btn icon" data-action="undo" data-i18n-title="undo" title="Undo"><svg class="icon" viewBox="0 0 24 24"><use href="#i-undo"/></svg></button>
      <button class="btn icon" data-action="redo" data-i18n-title="redo" title="Redo"><svg class="icon" viewBox="0 0 24 24"><use href="#i-redo"/></svg></button>
    </div>

    <div class="bar-group zoom-group">
      <button class="btn icon" data-action="zoom-out" title="zoomOut"><svg class="icon" viewBox="0 0 24 24"><use href="#i-zoom-out"/></svg></button>
      <input type="range" id="zoom-slider" class="zoom-slider" min="10" max="400" step="5" value="100" aria-label="zoom">
      <button class="btn icon" data-action="zoom-in" title="zoomIn"><svg class="icon" viewBox="0 0 24 24"><use href="#i-zoom-in"/></svg></button>
      <button class="btn icon" data-action="fit-width" title="fitWidth"><svg class="icon" viewBox="0 0 24 24"><use href="#i-fit-width"/></svg></button>
      <button class="btn icon" data-action="fit-page" title="fitPage"><svg class="icon" viewBox="0 0 24 24"><use href="#i-fit-page"/></svg></button>
      <span class="zoom-label" id="zoom-label">100%</span>
    </div>

    <div class="bar-group right">
      <button class="btn icon" data-action="print" title="print"><svg class="icon" viewBox="0 0 24 24"><use href="#i-print"/></svg></button>
      <button class="btn icon" data-action="properties" title="props.title"><svg class="icon" viewBox="0 0 24 24"><use href="#i-properties"/></svg></button>
      <button class="btn icon" data-action="shortcuts" title="shortcuts.title"><svg class="icon" viewBox="0 0 24 24"><use href="#i-help"/></svg></button>
      <span class="bar-sep"></span>
      <select id="units-select" class="select" data-i18n-label="units.title" aria-label="units"></select>
      <select id="theme-select" class="select" data-i18n-label="ui.theme" aria-label="Theme"></select>
      <select id="lang-select" class="select" data-i18n-label="ui.language" aria-label="Language"></select>
    </div>
  </header>

  <!-- ─────────────────────────── workspace ─────────────────────────── -->
  <main class="workspace" id="workspace">
    <aside class="sidebar left" id="sidebar-left">
      <nav class="tabs" id="side-tabs" role="tablist">
        <button data-tab="pages" role="tab" class="active"><svg class="icon" viewBox="0 0 24 24"><use href="#i-pages"/></svg><span data-i18n="tab.pages">Pages</span></button>
        <button data-tab="text" role="tab"><svg class="icon" viewBox="0 0 24 24"><use href="#i-text"/></svg><span data-i18n="tab.text">Text</span></button>
        <button data-tab="images" role="tab"><svg class="icon" viewBox="0 0 24 24"><use href="#i-image"/></svg><span data-i18n="tab.images">Images</span></button>
        <button data-tab="layers" role="tab"><svg class="icon" viewBox="0 0 24 24"><use href="#i-layers"/></svg><span data-i18n="tab.layers">Layers</span></button>
        <button data-tab="search" role="tab"><svg class="icon" viewBox="0 0 24 24"><use href="#i-search"/></svg><span data-i18n="tab.search">Search</span></button>
        <button data-tab="fonts" role="tab"><svg class="icon" viewBox="0 0 24 24"><use href="#i-font"/></svg><span data-i18n="tab.fonts">Fonts</span></button>
        <button data-tab="history" role="tab"><svg class="icon" viewBox="0 0 24 24"><use href="#i-history"/></svg><span data-i18n="tab.history">History</span></button>
      </nav>
      <div class="tab-panels">
        <div class="panel active" data-panel="pages"></div>
        <div class="panel" data-panel="text"></div>
        <div class="panel" data-panel="images"></div>
        <div class="panel" data-panel="layers"></div>
        <div class="panel" data-panel="search"></div>
        <div class="panel" data-panel="fonts"></div>
        <div class="panel" data-panel="history"></div>
      </div>
      <div class="sidebar-foot">
        <button class="btn btn-small" data-action="add-page"><svg class="icon" viewBox="0 0 24 24"><use href="#i-plus"/></svg><span data-i18n="pages.add">Add page</span></button>
      </div>
    </aside>

    <div class="splitter" data-split="left" role="separator" aria-orientation="vertical"></div>

    <section class="stage" id="stage">
      <div class="viewport" id="viewport"></div>
      <div class="dropzone" id="dropzone">
        <div class="dropzone-inner">
          <span class="dropzone-icon"><svg class="icon" viewBox="0 0 24 24"><use href="#i-upload"/></svg></span>
          <h1 data-i18n="appName">HTML PDF Modifier</h1>
          <p data-i18n="msg.dropFile">Drop a PDF here</p>
          <div class="dropzone-actions">
            <button class="btn primary big" data-action="open"><svg class="icon" viewBox="0 0 24 24"><use href="#i-open"/></svg><span data-i18n="open">Open PDF</span></button>
            <button class="btn big" data-action="open-url"><svg class="icon" viewBox="0 0 24 24"><use href="#i-link"/></svg><span data-i18n="openUrl">From URL</span></button>
          </div>
          <ul class="dropzone-features">
            <li><svg class="icon" viewBox="0 0 24 24"><use href="#i-text"/></svg><span data-i18n="feat.text">Edit any text</span></li>
            <li><svg class="icon" viewBox="0 0 24 24"><use href="#i-image"/></svg><span data-i18n="feat.image">Replace images</span></li>
            <li><svg class="icon" viewBox="0 0 24 24"><use href="#i-checkbox"/></svg><span data-i18n="feat.forms">Fillable forms</span></li>
            <li><svg class="icon" viewBox="0 0 24 24"><use href="#i-globe"/></svg><span data-i18n="feat.languages">Every language</span></li>
          </ul>
          <p class="note" data-i18n="ui.hint"></p>
        </div>
      </div>
    </section>

    <div class="splitter" data-split="right" role="separator" aria-orientation="vertical"></div>

    <aside class="sidebar right" id="sidebar-right">
      <div class="inspector-head"><span data-i18n="prop.inspector">Inspector</span></div>
      <div class="inspector" id="inspector"></div>
    </aside>
  </main>

  <!-- ─────────────────────────── status bar ─────────────────────────── -->
  <footer class="statusbar">
    <span class="status-chip" id="status-state"></span>
    <span class="status-chip" id="status-page"></span>
    <span class="status-chip" id="status-selection"></span>
    <span class="spacer"></span>
    <span class="status-chip dim" id="status-hint"></span>
    <span class="status-chip dim" id="status-zoom"></span>
    <span class="status-chip dim" id="status-saved"></span>
  </footer>

  <div class="busy" id="busy"><div class="spinner"></div><span id="busy-text"></span></div>
  <div class="toast-stack" id="toast-stack"></div>
  <div class="menu" id="context-menu" hidden></div>

  <div class="modal" id="modal">
    <div class="modal-box" role="dialog" aria-modal="true">
      <header class="modal-head">
        <h2 id="modal-title"></h2>
        <button class="btn icon ghost" data-modal-cancel><svg class="icon" viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
      </header>
      <div class="modal-body" id="modal-body"></div>
      <footer class="modal-foot">
        <button class="btn" data-modal-cancel data-i18n="msg.cancel">Cancel</button>
        <button class="btn primary" data-modal-ok data-i18n="msg.ok">OK</button>
      </footer>
    </div>
  </div>
</div>

<input type="file" id="file-input" accept="application/pdf,.pdf" hidden>
<input type="file" id="project-input" accept="application/json,.json" hidden>
<input type="file" id="font-input" accept=".ttf,.otf,.woff,.woff2,font/ttf,font/otf" hidden>
<input type="file" id="image-input" accept="image/*" hidden>

<script src="js/vendor/pdf.min.js"></script>
<script src="js/vendor/pdf-lib.min.js"></script>
<script src="js/vendor/fontkit.umd.min.js"></script>
<script src="js/core/text.js"></script>
<script src="js/core/ops.js"></script>
<script src="js/core/exporter.js"></script>
<script src="js/app/i18n.js"></script>
<script src="js/app/icons.js"></script>
<script src="js/app/units.js"></script>
<script src="js/app/arrange.js"></script>
<script src="js/app/fonts.js"></script>
<script src="js/app/pdfsource.js"></script>
<script src="js/app/viewer.js"></script>
<script src="js/app/inspector.js"></script>
<script src="js/app/dialogs.js"></script>
<script src="js/app/main.js"></script>
</body>
</html>
